<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#081729"/>
            <stop offset="50%" stop-color="#133D6B"/>
            <stop offset="100%" stop-color="#071221"/>
        </linearGradient>
        <radialGradient id="ambientGlow" cx="70%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
            <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#030810" stop-opacity="0.75"/>
        </radialGradient>
    </defs>

    <!-- Deep Academic Canvas Background -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    <rect width="1920" height="1080" fill="url(#ambientGlow)"/>

    <!-- Subtle Technical Background Grid -->
    <g opacity="0.06">
        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-width="1"/>
        </pattern>
        <rect width="1920" height="1080" fill="url(#grid)"/>
    </g>

    <!-- Ambient Rings -->
    <circle cx="1500" cy="540" r="420" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.12"/>
    <circle cx="1500" cy="540" r="600" stroke="#FBBF24" stroke-width="1" stroke-dasharray="12 12" fill="none" opacity="0.08"/>

    <!-- Subject Specific Illustration -->
    
            <!-- Candlestick Trend / Growth Chart & Scale of Value -->
            <g opacity="0.22" transform="translate(800, 320)">
                <!-- Candlesticks -->
                <line x1="80" y1="40" x2="80" y2="280" stroke="#38BDF8" stroke-width="2"/>
                <rect x="65" y="100" width="30" height="110" fill="rgba(56,189,248,0.25)" stroke="#38BDF8" stroke-width="2"/>
                
                <line x1="160" y1="80" x2="160" y2="340" stroke="#FBBF24" stroke-width="2"/>
                <rect x="145" y="120" width="30" height="140" fill="rgba(251,191,36,0.25)" stroke="#FBBF24" stroke-width="2"/>

                <line x1="240" y1="20" x2="240" y2="240" stroke="#34D399" stroke-width="2"/>
                <rect x="225" y="60" width="30" height="120" fill="rgba(52,211,153,0.3)" stroke="#34D399" stroke-width="2"/>

                <line x1="320" y1="10" x2="320" y2="210" stroke="#38BDF8" stroke-width="2"/>
                <rect x="305" y="40" width="30" height="110" fill="rgba(56,189,248,0.3)" stroke="#38BDF8" stroke-width="2"/>

                <line x1="400" y1="0" x2="400" y2="170" stroke="#34D399" stroke-width="2"/>
                <rect x="385" y="20" width="30" height="100" fill="rgba(52,211,153,0.35)" stroke="#34D399" stroke-width="2"/>
                
                <!-- Ascending Exponential Line -->
                <path d="M40 300 Q 240 220 440 20" fill="none" stroke="#FBBF24" stroke-width="4"/>
            </g>
            <circle cx="1400" cy="540" r="260" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="10 8" fill="none" opacity="0.18"/>
        

    <!-- High-End Dark Vignette Overlay -->
    <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>