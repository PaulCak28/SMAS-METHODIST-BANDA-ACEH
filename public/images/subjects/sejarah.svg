<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E1208"/>
            <stop offset="50%" stop-color="#4A2E16"/>
            <stop offset="100%" stop-color="#071221"/>
        </linearGradient>
        <radialGradient id="ambientGlow" cx="70%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#FCD34D" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
            <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#030810" stop-opacity="0.75"/>
        </radialGradient>
    </defs>

    <!-- Deep Academic Canvas Background -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    <rect width="1920" height="1080" fill="url(#ambientGlow)"/>

    <!-- Subtle Technical Background Grid -->
    <g opacity="0.06">
        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-width="1"/>
        </pattern>
        <rect width="1920" height="1080" fill="url(#grid)"/>
    </g>

    <!-- Ambient Rings -->
    <circle cx="1500" cy="540" r="420" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.12"/>
    <circle cx="1500" cy="540" r="600" stroke="#FCD34D" stroke-width="1" stroke-dasharray="12 12" fill="none" opacity="0.08"/>

    <!-- Subject Specific Illustration -->
    
            <!-- Classical Column & Hourglass & Timeline Arc -->
            <g opacity="0.25" transform="translate(1120, 340)">
                <!-- Column Top & Body -->
                <rect x="-80" y="0" width="160" height="28" rx="6" fill="none" stroke="#FCD34D" stroke-width="3"/>
                <rect x="-60" y="28" width="120" height="20" rx="3" fill="none" stroke="#F59E0B" stroke-width="2"/>
                <line x1="-50" y1="48" x2="-50" y2="340" stroke="#FCD34D" stroke-width="3"/>
                <line x1="-20" y1="48" x2="-20" y2="340" stroke="#F59E0B" stroke-width="2"/>
                <line x1="20" y1="48" x2="20" y2="340" stroke="#F59E0B" stroke-width="2"/>
                <line x1="50" y1="48" x2="50" y2="340" stroke="#FCD34D" stroke-width="3"/>
                <rect x="-70" y="340" width="140" height="30" rx="4" fill="none" stroke="#FCD34D" stroke-width="3"/>
            </g>
            <!-- Hourglass / Sun Clock -->
            <g opacity="0.22" transform="translate(1420, 520)">
                <polygon points="-60,-90 60,-90 0,0 -60,90 60,90 0,0" fill="none" stroke="#F59E0B" stroke-width="3"/>
                <line x1="-80" y1="-95" x2="80" y2="-95" stroke="#FCD34D" stroke-width="4"/>
                <line x1="-80" y1="95" x2="80" y2="95" stroke="#FCD34D" stroke-width="4"/>
                <circle cx="0" cy="40" r="15" fill="#F59E0B" opacity="0.5"/>
            </g>
            <!-- Historical Timeline Wheel -->
            <circle cx="960" cy="540" r="380" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="14 10" fill="none" opacity="0.18"/>
            <circle cx="960" cy="540" r="500" stroke="#FCD34D" stroke-width="1" stroke-dasharray="6 12" fill="none" opacity="0.12"/>
        

    <!-- High-End Dark Vignette Overlay -->
    <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>