<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F1E16"/>
            <stop offset="50%" stop-color="#1C4232"/>
            <stop offset="100%" stop-color="#071221"/>
        </linearGradient>
        <radialGradient id="ambientGlow" cx="70%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#6EE7B7" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
            <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#030810" stop-opacity="0.75"/>
        </radialGradient>
    </defs>

    <!-- Deep Academic Canvas Background -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    <rect width="1920" height="1080" fill="url(#ambientGlow)"/>

    <!-- Subtle Technical Background Grid -->
    <g opacity="0.06">
        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
            <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-width="1"/>
        </pattern>
        <rect width="1920" height="1080" fill="url(#grid)"/>
    </g>

    <!-- Ambient Rings -->
    <circle cx="1500" cy="540" r="420" stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.12"/>
    <circle cx="1500" cy="540" r="600" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="12 12" fill="none" opacity="0.08"/>

    <!-- Subject Specific Illustration -->
    
            <!-- Radiant Light & Olive Branch & Sacred Book -->
            <g opacity="0.24" transform="translate(1080, 520)">
                <!-- Radiant Rays -->
                <line x1="0" y1="-260" x2="0" y2="260" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="8 8"/>
                <line x1="-260" y1="0" x2="260" y2="0" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="8 8"/>
                <line x1="-180" y1="-180" x2="180" y2="180" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 8"/>
                <line x1="-180" y1="180" x2="180" y2="-180" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 8"/>
                <circle cx="0" cy="0" r="160" stroke="#6EE7B7" stroke-width="2.5" fill="none"/>
                <circle cx="0" cy="0" r="220" stroke="#10B981" stroke-width="1.5" fill="none"/>
            </g>
            <circle cx="960" cy="540" r="480" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="14 10" fill="none" opacity="0.12"/>
        

    <!-- High-End Dark Vignette Overlay -->
    <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>